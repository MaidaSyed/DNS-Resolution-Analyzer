// Recursive resolver 10.10.2.53 serving Do53 (53), DoT (853) and DoH (443).
// Placeholders (@...@) are filled in by the lab script.
include "@RUNDIR@/rndc.key";
controls { inet 127.0.0.1 port 9953 allow { 127.0.0.1; } keys { "lab-key"; }; };

tls lab-tls {
    cert-file "@CERTDIR@/resolver.crt";
    key-file  "@CERTDIR@/resolver.key";
    protocols { TLSv1.3; };       // TLS 1.3 only, as the project specifies
};
http lab-http {
    endpoints { "/dns-query"; };  // RFC 8484 DoH path
};

options {
    directory "@RUNDIR@";
    pid-file "@RUNDIR@/named.pid";
    session-keyfile "@RUNDIR@/session.key";
    listen-on                                  { 10.10.2.53; };        // Do53: UDP+TCP 53
    listen-on port 853 tls lab-tls             { 10.10.2.53; };        // DoT
    listen-on port 443 tls lab-tls http lab-http { 10.10.2.53; };      // DoH (HTTP/2)
    listen-on-v6 { none; };
    recursion yes;
    allow-recursion { 10.10.1.0/24; 10.10.2.0/24; 127.0.0.1; };
    allow-query { any; };
    dnssec-validation no;         // our private root has no DNSSEC trust anchor
    qname-minimization disabled;  // walk the tree like our own resolver does
    version none;
};
logging {
    channel logfile { file "@RUNDIR@/named.log" versions 1 size 20m; print-time yes; severity info; };
    category default { logfile; };
};
// Where this resolver starts its walk: our private root.
zone "." { type hint; file "@CONFDIR@/root.hints"; };
