// Private ROOT server (10.10.3.10). Placeholders (@...@) are filled in by the lab script.
options {
    directory "@RUNDIR@";
    pid-file "@RUNDIR@/named.pid";
    session-keyfile "@RUNDIR@/session.key";
    listen-on { 10.10.3.10; };
    listen-on-v6 { none; };
    recursion no;                 // authoritative only: gives referrals, never recurses
    allow-query { any; };
    allow-transfer { none; };
    version none;
    dnssec-validation no;
};
logging {
    channel logfile { file "@RUNDIR@/named.log" versions 1 size 5m; print-time yes; severity info; };
    category default { logfile; };
    category queries { logfile; };
};
zone "." { type primary; file "@ZONEDIR@/root.zone"; };
